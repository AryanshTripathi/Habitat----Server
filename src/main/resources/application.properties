spring.application.name=habitat-server

# Listens on $PORT when the host injects one (e.g. Render), falls back to 8080 locally
server.port=${PORT:8080}

# Time zone used for "today" when a request has no valid X-Timezone header. Blank = the server's own zone.
# Override with the HABITAT_DEFAULT_TIMEZONE environment variable, e.g. Asia/Kolkata.
habitat.default-timezone=

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:habitatdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
